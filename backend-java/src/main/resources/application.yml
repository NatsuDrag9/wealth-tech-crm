server:
  port: 8080
  
spring:
  application:
    name: wealth-tech-crm-java
  
  datasource:
    url: jdbc:postgresql://localhost:5432/wealth_tech_crm_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 15000       # 15s connection timeout
      validation-timeout: 5000         # 5s validation timeout
      idle-timeout: 300000             # 5 minutes
      max-lifetime: 1800000            # 30 minutes
      maximum-pool-size: 10            # Bounded pool size preventing resource exhaustion
      minimum-idle: 2
      leak-detection-threshold: 20000  # 20s leak warning

  jpa:
    hibernate:
      ddl-auto: update
      # Automatically creates/updates DB tables in dev mode
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT Custom Security Properties
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971 # 256-bit Secret Key
  access-token-expiration-ms: 900000     # 15 Minutes (15 * 60 * 1000)

# AWS S3 / LocalStack Storage Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566} # LocalStack default endpoint
    bucket-name: ${AWS_S3_BUCKET:wealthtech-crm-bucket}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE:true} # Required for LocalStack
    presigned-url-duration-minutes: ${AWS_S3_PRESIGNED_MINUTES:60}

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Spring Boot Actuator & Prometheus Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: crm-backend-java
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Google Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  api-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
  generation-model: ${GEMINI_GENERATION_MODEL:gemini-2.0-flash}
  generation-temperature: ${GEMINI_GENERATION_TEMPERATURE:0.1}

# RAG Knowledge & Grounded Synthesis Configuration
rag:
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.65}
  top-k: ${RAG_TOP_K:5}

resilience:
  defaults:
    max-retries: 3
    base-delay-ms: 500
    max-delay-ms: 5000
    jitter-percent: 20
    connect-timeout-ms: 15000
    request-timeout-ms: 30000
  gemini:
    max-retries: ${GEMINI_MAX_RETRIES:${resilience.defaults.max-retries}}
    base-delay-ms: ${GEMINI_BASE_DELAY_MS:${resilience.defaults.base-delay-ms}}
    max-delay-ms: ${GEMINI_MAX_DELAY_MS:${resilience.defaults.max-delay-ms}}
    jitter-percent: ${GEMINI_JITTER_PERCENT:${resilience.defaults.jitter-percent}}
    connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:${resilience.defaults.connect-timeout-ms}}
    request-timeout-ms: ${GEMINI_REQUEST_TIMEOUT_MS:${resilience.defaults.request-timeout-ms}}
  s3:
    max-retries: ${S3_MAX_RETRIES:${resilience.defaults.max-retries}}
    base-delay-ms: ${S3_BASE_DELAY_MS:${resilience.defaults.base-delay-ms}}
    max-delay-ms: ${S3_MAX_DELAY_MS:${resilience.defaults.max-delay-ms}}
    jitter-percent: ${S3_JITTER_PERCENT:${resilience.defaults.jitter-percent}}
  ingestion:
    max-retries: ${INGESTION_MAX_RETRIES:${resilience.defaults.max-retries}}
    base-delay-ms: ${INGESTION_BASE_DELAY_MS:${resilience.defaults.base-delay-ms}}
    max-delay-ms: ${INGESTION_MAX_DELAY_MS:${resilience.defaults.max-delay-ms}}
    jitter-percent: ${INGESTION_JITTER_PERCENT:${resilience.defaults.jitter-percent}}
